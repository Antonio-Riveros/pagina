<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    {% for video in videos %}
    <article class="group relative flex flex-col bg-slate-900/80 border border-slate-800 rounded-2xl overflow-hidden hover:border-indigo-500/30 hover:shadow-2xl hover:shadow-indigo-500/20 transition-all duration-300 group-hover:-translate-y-1 cursor-pointer" data-modal-target="video-modal-{{ video.id }}">
        <div class="relative aspect-video overflow-hidden bg-slate-950">
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-slate-950/20 to-transparent z-10 pointer-events-none"></div>
            {% if video.miniatura %}
            <img src="{{ video.miniatura.url }}" alt="{{ video.titulo }}" class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-105" loading="lazy">
            {% else %}
            <div class="w-full h-full bg-slate-900 flex items-center justify-center">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-slate-700"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
            </div>
            {% endif %}
            
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-12 h-12 bg-slate-950/60 backdrop-blur-md rounded-full flex items-center justify-center text-white z-20 border border-white/10 shadow-xl transition-all duration-300 group-hover:scale-110 group-hover:bg-indigo-600/80 group-hover:border-indigo-400/50">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </div>
        </div>
        
        <div class="p-6 flex flex-col flex-grow relative z-20">
            <h3 class="text-xl font-bold text-slate-50 mb-2 group-hover:text-indigo-400 transition-colors duration-300 line-clamp-2">{{ video.titulo }}</h3>
            <p class="text-sm text-slate-400 mb-4 flex items-center gap-2">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                <a href="{% url 'projects:detail' video.proyecto.slug %}" class="hover:text-slate-50 transition-colors hover:underline" onclick="event.stopPropagation()">{{ video.proyecto.titulo }}</a>
            </p>
            {% if video.descripcion %}
            <p class="text-slate-500 text-sm line-clamp-2 mt-auto">
                {{ video.descripcion }}
            </p>
            {% endif %}
        </div>
    </article>
    
    <!-- Modal for Video -->
    <div class="modal-overlay fixed inset-0 z-[100] hidden items-center justify-center bg-slate-950/90 backdrop-blur-sm p-4 opacity-0 transition-opacity duration-300" id="video-modal-{{ video.id }}">
        <div class="modal-content relative w-full max-w-5xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden scale-95 transition-transform duration-300">
            <button class="modal-close absolute top-4 right-4 z-10 w-10 h-10 bg-black/50 hover:bg-indigo-600 text-white rounded-full flex items-center justify-center transition-colors">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <div class="video-container aspect-video w-full bg-black">
                <iframe data-src="https://www.youtube.com/embed/{{ video.youtube_id }}?autoplay=1" class="w-full h-full" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-span-1 md:col-span-2 lg:col-span-3 py-16 text-center border border-slate-800 rounded-3xl bg-slate-900/50 backdrop-blur-sm">
        <div class="w-16 h-16 mx-auto mb-4 flex items-center justify-center rounded-full bg-slate-800 text-slate-500">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
        </div>
        <p class="text-slate-400 font-medium">No se encontraron videos que coincidan con la búsqueda.</p>
    </div>
    {% endfor %}
</div>

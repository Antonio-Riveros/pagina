<div class="grid md:grid-cols-3 gap-8">
    {% for video in videos %}
    <div class="card" style="cursor: pointer;" data-modal-target="video-modal-{{ video.id }}">
        <div class="card-img-wrapper">
            {% if video.miniatura %}
            <img src="{{ video.miniatura.url }}" alt="{{ video.titulo }}" class="card-img" loading="lazy">
            {% else %}
            <div class="card-img" style="background-color: var(--bg-tertiary);"></div>
            {% endif %}
            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.6); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">
                <i class="fa-solid fa-play"></i>
            </div>
        </div>
        <div class="card-body">
            <h3 class="card-title">{{ video.titulo }}</h3>
            <p class="text-muted" style="font-size: 0.9rem; margin-bottom: var(--space-2);">
                Proyecto: <a href="{% url 'projects:detail' video.proyecto.slug %}" class="text-primary" style="text-decoration: underline;">{{ video.proyecto.titulo }}</a>
            </p>
            {% if video.descripcion %}
            <p class="card-text" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                {{ video.descripcion }}
            </p>
            {% endif %}
        </div>
    </div>
    
    <!-- Modal for Video -->
    <div class="modal-overlay" id="video-modal-{{ video.id }}">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <div class="video-container">
                <iframe data-src="https://www.youtube.com/embed/{{ video.youtube_id }}?autoplay=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>
    </div>
    {% empty %}
    <p class="text-center text-muted" style="grid-column: span 3; padding: var(--space-8) 0;">
        No se encontraron videos que coincidan con la búsqueda.
    </p>
    {% endfor %}
</div>

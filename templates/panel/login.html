<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CMS</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/panel.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: var(--panel-bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: var(--panel-text);
        }
        
        .login-card {
            background: var(--panel-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--panel-accent), #c084fc);
        }
        
        .login-logo {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            color: #fff;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--panel-text-muted);
            font-size: 0.9rem;
        }
        
        .form-control {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--panel-accent);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.2);
            background: rgba(0, 0, 0, 0.4);
        }
        
        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: var(--panel-accent);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-submit:hover {
            background: var(--panel-accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(139, 92, 246, 0.4);
        }
        
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-logo">
            <i class="fa-solid fa-code"></i> CMS
        </div>
        
        <p style="text-align: center; color: var(--panel-text-muted); margin-bottom: 2rem;">Ingresa tus credenciales para administrar el portfolio.</p>
        
        {% if form.errors %}
        <div class="error-message">
            <i class="fa-solid fa-circle-exclamation"></i> Usuario o contraseña incorrectos.
        </div>
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label" for="id_username">Usuario</label>
                <input type="text" name="username" class="form-control" id="id_username" placeholder="Tu usuario" required autofocus>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="id_password">Contraseña</label>
                <input type="password" name="password" class="form-control" id="id_password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-submit">
                Ingresar al Panel <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 2rem;">
            <a href="{% url 'home' %}" style="color: var(--panel-text-muted); text-decoration: none; font-size: 0.9rem; transition: color 0.2s;">
                <i class="fa-solid fa-arrow-left"></i> Volver al sitio web
            </a>
        </div>
    </div>

</body>
</html>
